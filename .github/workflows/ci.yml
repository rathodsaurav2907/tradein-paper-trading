name: TradeIn Paper Trading CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradein
          POSTGRES_USER: tradein
          POSTGRES_PASSWORD: tradein
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Initialize Database Schema
        run: PGPASSWORD=tradein psql -h localhost -U tradein -d tradein -f database/schema.sql

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: postgresql://tradein:tradein@localhost:5432/tradein
          REDIS_URL: redis://localhost:6379
          PORT: 5002
          NODE_ENV: test
        run: npm test

  docker-build:
    name: Docker Build & Verification
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tradein-paper-trading:latest
