services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4005:5002"
    environment:
      PORT: 5002
      NODE_ENV: development
      DATABASE_URL: postgresql://tradein:tradein@postgres:5432/tradein
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npx nodemon src/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: tradein
      POSTGRES_USER: tradein
      POSTGRES_PASSWORD: tradein
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradein -d tradein"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
